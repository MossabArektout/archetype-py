[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acme-archetype-rules"
version = "0.1.0"
description = "Example shared Archetype rule pack for the acme org."
requires-python = ">=3.11"
dependencies = ["archetype-py"]

[tool.hatch.build.targets.wheel]
packages = ["acme_archetype_rules"]
