[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archetype-py"
version = "0.4.0"
description = "Enforce architectural rules as code. Catch structural violations before they merge."
readme = { file = "PYPI.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
  { name = "Mossab Arektout", email = "mossabarektout2000@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "networkx",
  "click",
  "rich",
]

[project.urls]
Homepage = "https://github.com/MossabArektout/archetype-py"
Documentation = "https://github.com/MossabArektout/archetype-py"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "hatch",
]
# Benchmarks are run with `python benchmarks/run_benchmarks.py`
# and regression tests with `pytest -m benchmark`.
benchmarks = []

[project.scripts]
archetype = "archetype.check:cli"

[project.entry-points.pytest11]
archetype = "archetype.plugin.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["archetype"]

[tool.pytest.ini_options]
# -p no:archetype: archetype registers itself as a pytest11 plugin (see
# [project.entry-points.pytest11] above) so `archetype check` rules can run
# as pytest items in *other* projects. Loading that plugin here too pulls in
# archetype.analysis.models, archetype.config, archetype.dsl.query, and
# archetype.reporter before pytest-cov starts tracing, so coverage.py can
# never credit their module-level lines -- inflating "0% covered" on files
# that are, in fact, exercised by nearly every test. It has no effect on
# what tests run: nothing under tests/ is named architecture.py, and
# test_plugin.py exercises the plugin through its own isolated
# pytester.runpytest_inprocess() sessions, which load it independently.
addopts = "-m \"not benchmark\" -p no:archetype"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "benchmark: marks tests as benchmarks (deselect with '-m not benchmark')",
]

[tool.coverage.run]
source = ["archetype"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 78
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
